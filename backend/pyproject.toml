[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "fm-luxe-api"
version = "0.1.0"
description = "FastAPI backend for FM LUXE"
requires-python = ">=3.12"
dependencies = [
  "bachs==2.0.0",
  "boto3>=1.40,<2.0",
  "alembic>=1.15,<2.0",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "sqlalchemy[asyncio]>=2.0.40,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.26,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
